apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datacache-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: datacache-sc
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: datacache-test-pod
spec:
  nodeSelector:
    cloud.google.com/gke-nodepool: datacache-node-pool
  containers:
  - name: writer
    image: busybox
    command: ["/bin/sh", "-c", "while true; do echo $(date) >> /mnt/data/test.log; sleep 1; done"]
    volumeMounts:
    - name: data-volume
      mountPath: /mnt/data
  volumes:
  - name: data-volume
    persistentVolumeClaim:
      claimName: datacache-pvc
